<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" width="1040" height="330" role="img"><rect width="1040" height="330" fill="#ffffff"/><text x="210" y="30" font-size="14" fill="#1b2329" text-anchor="middle" font-weight="bold" font-family="Noto Sans SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif">旅行商问题：走一圈，经过每个城市，越短越好</text><rect x="30" y="46" width="360" height="240" rx="8" fill="#f7f9fb" stroke="#c9ced3"/><line x1="68.70156848508442" y1="158.46830433184002" x2="63.93425687667066" y2="111.17866208813115" stroke="#1f6fd0" stroke-width="2.2" opacity=".8"/><line x1="63.93425687667066" y1="111.17866208813115" x2="200.72071433464913" y2="116.84883819776776" stroke="#1f6fd0" stroke-width="2.2" opacity=".8"/><line x1="200.72071433464913" y1="116.84883819776776" x2="330.2701475251868" y2="91.50913328409743" stroke="#1f6fd0" stroke-width="2.2" opacity=".8"/><line x1="330.2701475251868" y1="91.50913328409743" x2="343.0070150994941" y2="193.3051650960156" stroke="#1f6fd0" stroke-width="2.2" opacity=".8"/><line x1="343.0070150994941" y1="193.3051650960156" x2="298.55806966970897" y2="249.06555391763956" stroke="#1f6fd0" stroke-width="2.2" opacity=".8"/><line x1="298.55806966970897" y1="249.06555391763956" x2="281.96957242197925" y2="245.24174936642922" stroke="#1f6fd0" stroke-width="2.2" opacity=".8"/><line x1="281.96957242197925" y1="245.24174936642922" x2="246.87050846691056" y2="210.9395279595386" stroke="#1f6fd0" stroke-width="2.2" opacity=".8"/><line x1="246.87050846691056" y1="210.9395279595386" x2="223.12825777077913" y2="179.04882570633913" stroke="#1f6fd0" stroke-width="2.2" opacity=".8"/><line x1="223.12825777077913" y1="179.04882570633913" x2="68.70156848508442" y2="158.46830433184002" stroke="#1f6fd0" stroke-width="2.2" opacity=".8"/><circle cx="246.87050846691056" cy="210.9395279595386" r="6" fill="#1b2329"/><circle cx="298.55806966970897" cy="249.06555391763956" r="6" fill="#1b2329"/><circle cx="281.96957242197925" cy="245.24174936642922" r="6" fill="#1b2329"/><circle cx="68.70156848508442" cy="158.46830433184002" r="6" fill="#1b2329"/><circle cx="343.0070150994941" cy="193.3051650960156" r="6" fill="#1b2329"/><circle cx="330.2701475251868" cy="91.50913328409743" r="6" fill="#1b2329"/><circle cx="200.72071433464913" cy="116.84883819776776" r="6" fill="#1b2329"/><circle cx="223.12825777077913" cy="179.04882570633913" r="6" fill="#1b2329"/><circle cx="63.93425687667066" cy="111.17866208813115" r="6" fill="#1b2329"/><text x="210" y="308" font-size="12" fill="#5d6a73" text-anchor="middle" font-weight="normal" font-family="Noto Sans SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif">一条路线 = 一只蚂蚁走完一圈</text><text x="720" y="30" font-size="14" fill="#1b2329" text-anchor="middle" font-weight="bold" font-family="Noto Sans SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif">蚂蚁在每个城市怎么选下一站</text><text x="720" y="76" font-size="21" fill="#1b2329" text-anchor="middle" font-weight="bold" font-family="Noto Sans SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif">权重 =  τ^α  ×  η^β  ×  exp(κ · v)</text><rect x="460" y="110" width="12" height="44" fill="#c9501b"/><text x="484" y="126" font-size="14" fill="#1b2329" text-anchor="start" font-weight="bold" font-family="Noto Sans SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif">τ 信息素</text><text x="484" y="144" font-size="11.5" fill="#5d6a73" text-anchor="start" font-weight="normal" font-family="Noto Sans SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif">这一次搜索里，别的蚂蚁留下的痕迹 （实例内学，每条边一个数）</text><rect x="460" y="172" width="12" height="44" fill="#8d98a1"/><text x="484" y="188" font-size="14" fill="#1b2329" text-anchor="start" font-weight="bold" font-family="Noto Sans SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif">η = 1 / 距离</text><text x="484" y="206" font-size="11.5" fill="#5d6a73" text-anchor="start" font-weight="normal" font-family="Noto Sans SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif">越近越想去 （固定的先验）</text><rect x="460" y="234" width="12" height="44" fill="#1f6fd0"/><text x="484" y="250" font-size="14" fill="#1b2329" text-anchor="start" font-weight="bold" font-family="Noto Sans SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif">v 学到的边价值</text><text x="484" y="268" font-size="11.5" fill="#5d6a73" text-anchor="start" font-weight="normal" font-family="Noto Sans SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif">跨实例训练的蘑菇体给出 （v = 0 就是普通蚁群）</text><text x="720" y="310" font-size="12.5" fill="#1f6fd0" text-anchor="middle" font-weight="bold" font-family="Noto Sans SC,PingFang SC,Hiragino Sans GB,Microsoft YaHei,system-ui,sans-serif">我们只换最后一项 v 的来源，其余不动</text></svg>